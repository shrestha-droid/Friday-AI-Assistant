<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>F.R.I.D.A.Y.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@300;400&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04070b; --ink: #dce8f2; --dim: #7d92a7; --faint: #475a6c;
  --line: rgba(130, 185, 225, .16); --line2: rgba(130, 185, 225, .32);
  --a: #67e8f9; --b: #ffb454;                 /* accent pair, per persona */
  --u: #ff2e45; --u2: #ff8a3d;                /* Ultron, always here */
  --cond: 'Barlow Condensed', sans-serif; --mono: 'JetBrains Mono', monospace; --serif: 'Cormorant Garamond', serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
body[data-persona="jarvis"] { --a: #ffb454; --b: #67e8f9; }
body[data-persona="edith"]  { --a: #a3bcff; --b: #eef3fa; }
body[data-mood="ultron"]    { --a: #ff2e45; --b: #ff8a3d; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden;
  font: 300 15px/1.5 'Barlow', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  display: grid; grid-template-rows: 56px 1fr; transition: color .6s;
}
button, input, select { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; }
:focus-visible { outline: 1px solid var(--a); outline-offset: 3px; }

/* ---------- texture: blueprint grid, scanlines, grain, vignette ---------- */
#grid { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(120, 170, 210, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 170, 210, .045) 1px, transparent 1px),
    linear-gradient(rgba(120, 170, 210, .02) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 170, 210, .02) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
#grid::after { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 55% at 50% 45%, color-mix(in srgb, var(--a) 9%, transparent), transparent 70%); transition: background 1s; }
#scan { position: fixed; inset: 0; z-index: 60; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 1px, transparent 1px 3px); opacity: .35; }
#grain { position: fixed; inset: 0; z-index: 61; width: 100%; height: 100%; pointer-events: none; opacity: .10; mix-blend-mode: overlay; image-rendering: pixelated; }
#vig { position: fixed; inset: 0; z-index: 59; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0, 0, 0, .7) 100%); }

/* ---------- header ---------- */
header { position: relative; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 28px; border-bottom: 1px solid var(--line); }
.logo { font: 600 15px var(--cond); letter-spacing: .42em; color: var(--a); transition: color .6s; text-shadow: 0 0 18px color-mix(in srgb, var(--a) 55%, transparent); }
.logo small { margin-left: 14px; font: 400 10px var(--mono); letter-spacing: .18em; color: var(--faint); text-shadow: none; }
nav { display: flex; gap: 28px; height: 56px; }
nav button { position: relative; font: 500 12px var(--cond); letter-spacing: .32em; color: var(--dim); transition: color .3s; }
nav button:hover { color: var(--ink); }
nav button[aria-pressed="true"] { color: var(--a); }
nav button[aria-pressed="true"]::after { content: ''; position: absolute; left: 0; right: .32em; bottom: -1px; height: 2px; background: var(--a); box-shadow: 0 0 12px var(--a); }
.hright { display: flex; justify-content: flex-end; align-items: center; gap: 22px; font: 400 11px var(--mono); letter-spacing: .14em; color: var(--dim); }
#status { display: flex; align-items: center; gap: 9px; text-transform: uppercase; }
#status i { width: 6px; height: 6px; background: var(--a); box-shadow: 0 0 10px var(--a); transform: rotate(45deg); }
#status.busy i { animation: blink .5s steps(2) infinite; }
#status.eye { color: var(--b); } #status.eye i { background: var(--b); box-shadow: 0 0 10px var(--b); }
@keyframes blink { 50% { opacity: .15; } }
.ibtn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--dim); transition: all .25s; }
.ibtn:hover { color: var(--a); border-color: var(--a); }
.ibtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }
#panels-btn { display: none; }

/* ---------- main layout ---------- */
main { position: relative; display: grid;   /* no z-index: a stacking context here would stop #gl blending with the grid */ grid-template-columns: 290px minmax(0, 1fr) 360px; gap: 0; min-height: 0; }
.col { min-height: 0; padding: 22px 24px; display: flex; flex-direction: column; gap: 26px; }
.col.left { border-right: 1px solid var(--line); overflow-y: auto; }
.col.right { border-left: 1px solid var(--line); }
.panel { position: relative; }
.ph { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--line); font: 500 11px var(--cond); letter-spacing: .3em; color: var(--dim); text-transform: uppercase; }
.ph b { font: 400 10px var(--mono); letter-spacing: 0; color: var(--a); transition: color .6s; }
.ph .tabs { margin-left: auto; display: flex; gap: 14px; }
.ph .tabs button { font: 500 10px var(--cond); letter-spacing: .24em; color: var(--faint); }
.ph .tabs button[aria-selected="true"] { color: var(--a); }
.kv { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; padding: 5px 0; font: 400 11px var(--mono); color: var(--dim); }
.kv span:last-child { color: var(--ink); text-align: right; min-width: 44px; }
.kv canvas { width: 100%; height: 26px; }
.seg { display: flex; gap: 2px; height: 9px; }
.seg i { flex: 1; background: rgba(130, 185, 225, .1); }
.seg i.on { background: var(--a); box-shadow: 0 0 6px color-mix(in srgb, var(--a) 60%, transparent); }
.seg.warn i.on { background: var(--b); }
.list { font-size: 13px; }
.list div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.list small { font: 400 10px var(--mono); color: var(--faint); white-space: nowrap; }
.list .x { color: var(--faint); font: 400 12px var(--mono); } .list .x:hover { color: var(--u); }
.empty { color: var(--faint); font: 400 11px var(--mono); padding: 4px 0; }

/* corner brackets: the "machined" frame */
.br { position: relative; }
.br::before, .br::after { content: ''; position: absolute; width: 10px; height: 10px; border: 1px solid var(--line2); pointer-events: none; }
.br::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.br::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

/* ---------- transcript ---------- */
#log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.entry { display: grid; grid-template-columns: 58px 1fr; gap: 10px; animation: in .5s var(--ease); }
.entry time { font: 400 10px var(--mono); color: var(--faint); padding-top: 3px; }
.entry b { display: block; font: 500 10px var(--cond); letter-spacing: .3em; color: var(--a); }
.entry.you b { color: var(--dim); }
.entry p { font-size: 14px; color: var(--ink); }
.entry.you p { color: var(--dim); }
.entry.sys b { color: var(--b); } .entry.sys p { color: var(--dim); font: 400 11px var(--mono); }
.entry.ultron b { color: var(--u); font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 13px; letter-spacing: .12em; }
.entry.ultron p { font: italic 400 17px/1.35 var(--serif); color: #ffd4d8; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }

/* ---------- center: reticle + subtitles ---------- */
.center { position: relative; display: grid; grid-template-rows: 1fr auto auto; min-height: 0; }
#hud, #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
#gl { mix-blend-mode: screen; }   /* black = transparent: the hologram is pure light over the grid */
.views { display: flex; border: 1px solid var(--line); }
.views button { padding: 6px 12px; font: 500 10px var(--cond); letter-spacing: .3em; color: var(--faint); }
.views button[aria-pressed="true"] { color: var(--bg); background: var(--a); }
body.glitching header, body.glitching main { animation: uiglitch .46s steps(1) 1; }
@keyframes uiglitch {
  0%   { transform: translate(5px, 0);  clip-path: inset(0 0 62% 0);  filter: drop-shadow(-3px 0 rgba(255, 0, 40, .8)) drop-shadow(3px 0 rgba(0, 255, 255, .6)); }
  14%  { transform: translate(-7px, 0); clip-path: inset(38% 0 22% 0); }
  28%  { transform: translate(3px, 1px); clip-path: inset(8% 0 71% 0); }
  42%  { transform: translate(-2px, 0); clip-path: inset(72% 0 0 0); }
  56%  { transform: none; clip-path: inset(0); filter: none; }
  70%  { transform: translate(2px, 0);  clip-path: inset(30% 0 48% 0); filter: drop-shadow(2px 0 rgba(255, 0, 40, .8)); }
  84%  { transform: translate(-1px, 0); clip-path: inset(0); }
  100% { transform: none; clip-path: none; filter: none; }
}
#hud-click { position: absolute; left: 50%; top: 44%; width: 34vmin; height: 34vmin; transform: translate(-50%, -50%); border-radius: 50%; }
#subs { position: relative; z-index: 2; grid-row: 2; padding: 0 40px 18px; text-align: center; pointer-events: none; }
#activity { min-height: 18px; font: 400 10px var(--mono); letter-spacing: .24em; color: var(--b); text-transform: uppercase; margin-bottom: 10px; }
#line { font: 300 clamp(17px, 1.9vw, 24px)/1.4 'Barlow', sans-serif; text-wrap: balance; max-width: 760px; margin: 0 auto; text-shadow: 0 1px 24px rgba(0, 0, 0, .9); }
#line.dim { color: var(--dim); } #line.bad { color: var(--b); }
#line.long { font-size: clamp(15px, 1.4vw, 19px); }
#uline { display: none; max-width: 720px; margin: 16px auto 0; font: italic 400 clamp(19px, 2vw, 26px)/1.3 var(--serif); color: #ffd6da; text-shadow: 0 0 30px rgba(255, 46, 69, .55); }
#uline.on { display: block; animation: glitch .45s steps(3) 1; }
#uline::after { content: '— ULTRON'; display: block; margin-top: 6px; font: 500 10px var(--cond); font-style: normal; letter-spacing: .4em; color: var(--u); }
body[data-mood="ultron"] #line { font-family: var(--serif); font-style: italic; font-size: clamp(21px, 2.3vw, 30px); color: #ffd6da; text-shadow: 0 0 34px rgba(255, 46, 69, .6); }
@keyframes glitch { 0% { transform: translateX(-6px); text-shadow: 3px 0 #0ff, -3px 0 var(--u); clip-path: inset(10% 0 40% 0); } 50% { transform: translateX(4px); clip-path: inset(50% 0 5% 0); } 100% { transform: none; } }
#meta { margin-top: 10px; min-height: 14px; font: 400 10px var(--mono); letter-spacing: .14em; color: var(--faint); }

/* command line */
#cmd { position: relative; z-index: 2; grid-row: 3; margin: 0 40px 28px; display: flex; align-items: center; border: 1px solid var(--line2); background: rgba(4, 8, 14, .72); backdrop-filter: blur(8px); }
#cmd::before { content: '›'; padding: 0 4px 0 18px; font: 500 18px var(--mono); color: var(--a); }
#input { flex: 1; min-width: 0; padding: 15px 10px; font: 400 14px var(--mono); outline: 0; caret-color: var(--a); }
#input::placeholder { color: var(--faint); }
#mic, #send { height: 50px; padding: 0 20px; display: flex; align-items: center; gap: 10px; border-left: 1px solid var(--line); font: 500 11px var(--cond); letter-spacing: .3em; color: var(--dim); transition: all .25s; }
#mic:hover, #send:hover { color: var(--a); }
#mic[aria-pressed="true"] { color: var(--bg); background: var(--a); }
#mic svg, #send svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; }
#cmd .corner { position: absolute; width: 8px; height: 8px; border: 1px solid var(--a); }
#cmd .c1 { top: -4px; left: -4px; border-right: 0; border-bottom: 0; } #cmd .c2 { bottom: -4px; right: -4px; border-left: 0; border-top: 0; }
#keys { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font: 400 9px var(--mono); letter-spacing: .3em; color: var(--faint); }

/* ---------- authorization card ---------- */
#confirm { position: absolute; z-index: 5; left: 50%; bottom: 120px; transform: translateX(-50%); width: min(560px, calc(100% - 48px)); background: rgba(6, 9, 15, .94); border: 1px solid var(--b); animation: in .4s var(--ease); }
#confirm[hidden] { display: none; }
#confirm .haz { height: 8px; background: repeating-linear-gradient(-45deg, var(--b) 0 8px, transparent 8px 16px); opacity: .85; }
#confirm .body { padding: 16px 20px 18px; }
#confirm h4 { font: 600 12px var(--cond); letter-spacing: .4em; color: var(--b); margin-bottom: 12px; }
#c-s { font: 400 13px/1.55 var(--mono); padding: 12px 14px; border-left: 2px solid var(--b); background: rgba(255, 180, 84, .06); word-break: break-word; }
#c-w { margin-top: 10px; font: 400 11px var(--mono); color: var(--dim); }
#confirm .row { display: flex; gap: 10px; margin-top: 16px; }
#confirm .row button { flex: 1; padding: 12px; border: 1px solid var(--line2); font: 600 12px var(--cond); letter-spacing: .34em; transition: all .2s; }
#approve { background: var(--b); color: var(--bg); border-color: var(--b) !important; }
#deny:hover { border-color: var(--ink) !important; }
#ttl { height: 2px; background: var(--b); transform-origin: left; }

/* ---------- settings + toasts ---------- */
#settings { position: fixed; top: 64px; right: 24px; z-index: 40; width: 300px; padding: 18px 20px; background: rgba(6, 9, 15, .96); border: 1px solid var(--line2); }
#settings[hidden] { display: none; }
.field { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); font: 400 11px var(--mono); color: var(--dim); }
select { border: 1px solid var(--line2); padding: 6px 8px; font: 400 11px var(--mono); max-width: 160px; background: var(--bg); }
.sw { width: 34px; height: 16px; border: 1px solid var(--line2); position: relative; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: var(--dim); transition: transform .25s var(--ease); }
.sw[aria-checked="true"] { border-color: var(--a); } .sw[aria-checked="true"]::after { transform: translateX(18px); background: var(--a); }
.wide { width: 100%; margin-top: 14px; padding: 10px; border: 1px solid var(--line2); font: 500 11px var(--cond); letter-spacing: .3em; color: var(--dim); }
.wide:hover { color: var(--a); border-color: var(--a); }
#toasts { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 45; display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100vw - 32px)); }
.toast { padding: 12px 16px; background: rgba(6, 9, 15, .95); border: 1px solid var(--line2); border-left: 2px solid var(--a); font-size: 14px; animation: in .4s var(--ease); }
.toast b { display: block; font: 600 10px var(--cond); letter-spacing: .34em; color: var(--a); }
.toast.high { border-left-color: var(--b); } .toast.high b { color: var(--b); }
#drop { position: fixed; inset: 0; z-index: 70; display: none; place-items: center; background: rgba(4, 7, 11, .85); font: 600 18px var(--cond); letter-spacing: .5em; color: var(--a); }
#drop.on { display: grid; }

@media (max-width: 1100px) { main { grid-template-columns: 230px minmax(0, 1fr) 270px; } .col { padding: 18px 16px; } #cmd { margin: 0 20px 28px; } }
@media (max-width: 900px) {
  header { grid-template-columns: 1fr auto; padding: 0 14px; } .logo small, .hright #clock { display: none; }
  nav { gap: 16px; } nav button { letter-spacing: .2em; font-size: 11px; }
  .hright { gap: 10px; } #panels-btn { display: grid; }
  header .logo { display: none; }
  main { grid-template-columns: 1fr; }
  .col.left, .col.right { display: none; position: fixed; z-index: 30; left: 0; right: 0; background: rgba(4, 7, 11, .97); border: 0; }
  body.show-panels .col.left { display: flex; top: 56px; height: 45%; } body.show-panels .col.right { display: flex; top: 45%; bottom: 0; }
  #subs { padding: 0 18px 14px; } #cmd { margin: 0 14px 30px; } #mic span, #send span { display: none; } #mic, #send { padding: 0 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body data-persona="friday" data-mood="normal">
<div id="grid"></div><div id="vig"></div><div id="scan"></div><canvas id="grain" width="200" height="200"></canvas>

<header>
  <div class="logo" id="logo"><span id="logo-name">F.R.I.D.A.Y.</span><small>MK·II // LOCAL</small></div>
  <nav aria-label="Assistant">
    <button data-p="friday" aria-pressed="true">FRIDAY</button>
    <button data-p="jarvis" aria-pressed="false">JARVIS</button>
    <button data-p="edith" aria-pressed="false">EDITH</button>
  </nav>
  <div class="hright">
    <div class="views" role="group" aria-label="View">
      <button data-v="core" aria-pressed="true">CORE</button><button data-v="house" aria-pressed="false">HOUSE</button>
    </div>
    <span id="status"><i></i><span>connecting</span></span>
    <span id="clock"></span>
    <button class="ibtn" id="panels-btn" aria-label="Panels"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="ibtn" id="gear" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </div>
</header>

<main>
  <section class="col left">
    <div class="panel">
      <div class="ph"><b>01</b>System</div>
      <div class="kv"><span>CPU</span><canvas id="sp-cpu"></canvas><span id="v-cpu">--</span></div>
      <div class="kv"><span>MEMORY</span><canvas id="sp-ram"></canvas><span id="v-ram">--</span></div>
      <div class="kv"><span>DISK</span><div class="seg" id="seg-disk"></div><span id="v-disk">--</span></div>
      <div class="kv"><span>BATTERY</span><div class="seg" id="seg-bat"></div><span id="v-bat">--</span></div>
    </div>
    <div class="panel">
      <div class="ph"><b>02</b>Link</div>
      <div class="kv"><span>BRAIN</span><select id="model" aria-label="Brain model" style="grid-column: 2 / 4; max-width: none"></select></div>
      <div class="kv"><span>LATENCY</span><span></span><span id="v-lat">--</span></div>
      <div class="kv"><span>VOICE</span><span></span><span id="v-voice">--</span></div>
      <div class="kv"><span>SESSION</span><span></span><span id="v-sid">--</span></div>
    </div>
    <div class="panel">
      <div class="ph"><b>03</b>Today</div>
      <div class="list" id="today"></div>
    </div>
  </section>

  <section class="center">
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="hud" aria-hidden="true"></canvas>
    <button id="hud-click" aria-label="Talk"></button>
    <div id="subs" aria-live="polite">
      <div id="activity"></div>
      <div id="line" class="dim">Standing by.</div>
      <div id="uline"></div>
      <div id="meta"></div>
    </div>
    <form id="cmd" autocomplete="off">
      <span class="corner c1"></span><span class="corner c2"></span>
      <input id="input" placeholder="Speak or type a command" aria-label="Command">
      <button type="button" id="mic" aria-pressed="false" aria-label="Talk"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>TALK</span></button>
      <button type="submit" id="send" aria-label="Send"><span>SEND</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <div id="keys">SPACE TALK · ENTER SEND · ESC STOP</div>
    <section id="confirm" role="alertdialog" aria-labelledby="c-h" hidden>
      <div class="haz"></div>
      <div class="body">
        <h4 id="c-h">AUTHORIZATION REQUIRED</h4>
        <div id="c-s"></div><div id="c-w"></div>
        <div class="row"><button id="deny">DENY · ESC</button><button id="approve">AUTHORIZE</button></div>
      </div>
      <div id="ttl"></div>
    </section>
  </section>

  <section class="col right">
    <div class="panel" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="ph"><b>04</b><span id="rt">Transcript</span>
        <div class="tabs" role="tablist">
          <button role="tab" data-r="log" aria-selected="true">LOG</button>
          <button role="tab" data-r="mem" aria-selected="false">MEMORY</button>
        </div>
      </div>
      <div id="log"></div>
      <div id="mem" class="list" hidden style="overflow-y:auto"></div>
    </div>
  </section>
</main>

<section id="settings" hidden aria-label="Settings">
  <div class="ph"><b>05</b>Settings</div>
  <div class="field"><span>VOICE</span><select id="engine"><option value="gemini">Character voices</option><option value="browser">Browser voice</option><option value="off">Silent</option></select></div>
  <div class="field"><span>ALWAYS LISTENING</span><button class="sw" id="sw-always" role="switch" aria-checked="false" aria-label="Always listening"></button></div>
  <button class="wide" id="brief">BRIEF ME</button>
</section>
<div id="toasts" role="status"></div>
<div id="drop">DROP FILE FOR ANALYSIS</div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const SID = sessionStorage.getItem('sid') || (() => { const v = crypto.randomUUID().slice(0, 12); sessionStorage.setItem('sid', v); return v; })();
const S = { persona: store.get('persona', 'friday'), mood: 'normal', state: 'idle', engine: store.get('engine', 'gemini'),
            always: false, ptt: false, listening: false, busy: false, speaking: false, confirm: null, flash: 0,
            view: store.get('view', 'core'), override: false, level: 0, pulse: {}, glitchUntil: 0 };
window.FRI = { S };   // shared with the 3D module
const NAMES = { friday: 'F.R.I.D.A.Y.', jarvis: 'J.A.R.V.I.S.', edith: 'E.D.I.T.H.', ultron: 'ULTRON' };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= texture: film grain ================= */
(() => {
  const c = $('#grain'), g = c.getContext('2d'), img = g.createImageData(200, 200);
  let f = 0;
  (function loop() {
    if (!reduce && (f++ & 3) === 0) {   // ~15 fps is enough for grain
      for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
      g.putImageData(img, 0, 0);
    }
    requestAnimationFrame(loop);
  })();
})();

/* ================= audio: voices + analyser ================= */
let actx, analyser, freq, playing = null, speakGen = 0;
function audio() {
  if (!actx) { actx = new AudioContext(); analyser = actx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = .7; analyser.connect(actx.destination); freq = new Uint8Array(analyser.frequencyBinCount); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
addEventListener('pointerdown', audio, { once: true }); addEventListener('keydown', audio, { once: true });

function ultronChain(ctx, src) {
  // His voice gets a machine underneath it: a short metallic comb and a faint ring-modulated layer.
  const dry = ctx.createGain(); dry.gain.value = .85;
  const shelf = ctx.createBiquadFilter(); shelf.type = 'lowshelf'; shelf.frequency.value = 180; shelf.gain.value = 5;
  const comb = ctx.createDelay(); comb.delayTime.value = .011; const fb = ctx.createGain(); fb.gain.value = .38; const wet = ctx.createGain(); wet.gain.value = .22;
  const ring = ctx.createGain(); ring.gain.value = 0; const osc = ctx.createOscillator(); osc.frequency.value = 48; osc.connect(ring.gain); osc.start();
  const ringOut = ctx.createGain(); ringOut.gain.value = .12;
  src.connect(shelf); shelf.connect(dry); shelf.connect(comb); comb.connect(fb); fb.connect(comb); comb.connect(wet); shelf.connect(ring); ring.connect(ringOut);
  [dry, wet, ringOut].forEach(n => n.connect(analyser));
  src.onended = () => { try { osc.stop(); } catch {} };
}

async function fetchVoice(seg) {
  const r = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: seg.text, who: seg.who }) });
  if (!r.ok) throw new Error('tts');
  $('#v-voice').textContent = { kokoro: 'KOKORO (LOCAL)', gemini: 'GEMINI TTS' }[r.headers.get('X-Voice-Engine')] || 'CHARACTER';
  return audio().decodeAudioData(await r.arrayBuffer());
}
function playBuffer(buf, who, gen) {
  return new Promise(res => {
    if (gen !== speakGen) return res();
    const ctx = audio(), src = ctx.createBufferSource(); src.buffer = buf;
    if (who === 'ultron') { src.playbackRate.value = .96; ultronChain(ctx, src); } else src.connect(analyser);
    playing = src; src.onended = () => { playing = null; res(); }; src.start();
  });
}
const BVOICE = { friday: [['Moira', 'Samantha', 'Karen'], 1.05, 1.08], jarvis: [['Daniel', 'Oliver', 'Arthur'], .92, 1], edith: [['Serena', 'Tessa', 'Samantha'], 1.1, 1.12], ultron: [['Fred', 'Alex', 'Daniel'], .5, .86] };
function browserSay(seg, gen) {
  return new Promise(res => {
    const synth = speechSynthesis; if (!synth || gen !== speakGen) return res();
    const [names, pitch, rate] = BVOICE[seg.who] || BVOICE.friday, u = new SpeechSynthesisUtterance(seg.text.replace(/\bShrestha\b/gi, 'Shresht'));
    const all = synth.getVoices(); u.voice = names.map(n => all.find(v => v.name.startsWith(n))).find(Boolean) || null;
    u.pitch = pitch; u.rate = rate; u.onend = u.onerror = res; synth.speak(u);
  });
}
async function sayAll(segs) {
  stopSpeaking(); const gen = ++speakGen;
  if (S.engine === 'off' || !segs.length) return;
  // Sentence by sentence: the first sentence is voiced (and playing) while the rest are still being made.
  segs = segs.flatMap(s => (s.text.match(/[^.!?]+(?:[.!?]+["')\]]*|$)/g) || [s.text]).map(t => ({ who: s.who, text: t.trim() }))).filter(p => p.text);
  const loads = segs.map(s => S.engine === 'gemini' ? fetchVoice(s).catch(() => null) : Promise.resolve(null));
  S.speaking = true; setState('speaking');
  for (let i = 0; i < segs.length; i++) {
    const buf = await loads[i]; if (gen !== speakGen) return;
    if (segs[i].who === 'ultron') { S.flash = 1; ultronOverride(true); }
    if (buf) await playBuffer(buf, segs[i].who, gen);
    else { if (S.engine === 'gemini') $('#v-voice').textContent = 'BROWSER (fallback)'; await browserSay(segs[i], gen); }
    if (segs[i].who === 'ultron' && segs[i + 1]?.who !== 'ultron') { S.flash = 0; if (S.mood !== 'ultron') ultronOverride(false); }
  }
  if (gen === speakGen) { S.speaking = false; if (S.mood === 'ultron') setTimeout(() => !S.speaking && setMood('normal'), 1800); setState(S.state === 'off' ? 'off' : 'idle'); if (S.always && !S.busy) startRec(false); }
}
function stopSpeaking() { speakGen++; if (playing) { try { playing.stop(); } catch {} playing = null; } if (window.speechSynthesis) speechSynthesis.cancel(); S.speaking = false; S.flash = 0; }

/* ================= the reticle ================= */
const cv = $('#hud'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function fit() { DPR = Math.min(devicePixelRatio || 1, 2); const r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR; }
new ResizeObserver(fit).observe(cv); fit();
const hex = s => { s = s.trim().replace('#', ''); return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)]; };
let colA = [103, 232, 249], colB = [255, 180, 84]; const RED = [255, 46, 69];
const mixc = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
let ult = 0, energy = .2, spin = 0, glitchT = 0, born = performance.now(), hudA = 1;
const ENERGY = { idle: .2, listening: .55, thinking: 1, speaking: .7, off: .05 };
function glitch(ms = 420) { glitchT = S.glitchUntil = performance.now() + ms; }

// Ultron cutting in: the whole interface glitches over to him, then back.
function scramble(el, to) {
  const glyphs = '▓▒░<>/\\|#%&*+=?01', from = el.textContent, n = Math.max(from.length, to.length); let f = 0;
  clearInterval(el._scr); el._scr = setInterval(() => {
    f++; el.textContent = Array.from({ length: n }, (_, i) => i < f / 2 ? (to[i] || '') : glyphs[Math.random() * glyphs.length | 0]).join('');
    if (f / 2 >= n) { clearInterval(el._scr); el.textContent = to; }
  }, 22);
}
function ultronOverride(on) {
  if (S.override === on) return; S.override = on;
  document.body.classList.remove('glitching'); void document.body.offsetWidth; document.body.classList.add('glitching');
  setTimeout(() => document.body.classList.remove('glitching'), 480);
  glitch(on ? 520 : 380);
  if (S.mood !== 'ultron') document.body.dataset.mood = on ? 'ultron' : 'normal';
  scramble($('#logo-name'), on ? 'U.L.T.R.O.N.' : NAMES[S.persona]);
  $('#status').lastChild.textContent = on ? 'override' : LABEL[S.state];
}

function ring(r, a, w = 1) { ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.lineWidth = w; ctx.strokeStyle = a; ctx.stroke(); }
function arc(r, s, e, a, w) { ctx.beginPath(); ctx.arc(0, 0, r, s, e); ctx.lineWidth = w; ctx.strokeStyle = a; ctx.stroke(); }
function ticks(r, n, rot, col, every, long, short, alpha) {
  ctx.save(); ctx.rotate(rot); ctx.beginPath();
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, L = i % every ? short : long; ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); ctx.lineTo(Math.cos(a) * (r - L), Math.sin(a) * (r - L)); }
  ctx.lineWidth = 1; ctx.strokeStyle = rgba(col, alpha); ctx.stroke(); ctx.restore();
}
function textRing(str, r, rot, col, alpha) {
  ctx.save(); ctx.rotate(rot); ctx.font = `500 ${Math.max(8, r * .055)}px "JetBrains Mono"`; ctx.fillStyle = rgba(col, alpha); ctx.textAlign = 'center';
  const step = Math.PI * 2 / str.length;
  for (const ch of str) { ctx.rotate(step); ctx.save(); ctx.translate(0, -r); ctx.fillText(ch, 0, 0); ctx.restore(); }
  ctx.restore();
}
function poly(n, r, rot, col, a, w) { ctx.beginPath(); for (let i = 0; i <= n; i++) { const t = rot + i / n * Math.PI * 2; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(t) * r, Math.sin(t) * r); } ctx.lineWidth = w; ctx.strokeStyle = rgba(col, a); ctx.stroke(); }

function draw(now) {
  requestAnimationFrame(draw);
  const t = now / 1000, dt = 1 / 60;
  const cs = getComputedStyle(document.body);
  const wantA = hex(cs.getPropertyValue('--a')), wantB = hex(cs.getPropertyValue('--b'));
  colA = mixc(colA, wantA, .06); colB = mixc(colB, wantB, .06);
  // Ultron: full takeover, a flash while his aside plays, and a heartbeat-long flicker every minute or so.
  const flick = (Math.sin(t * .11) > .995 && Math.sin(t * 37) > 0) ? .9 : 0;
  ult += ((S.mood === 'ultron' ? 1 : Math.max(S.flash * .85, flick)) - ult) * .08;
  const A = mixc(colA, RED, ult), B = mixc(colB, [255, 138, 61], ult);

  let target = ENERGY[S.state] ?? .2;
  if (analyser && S.speaking) { analyser.getByteFrequencyData(freq); let sum = 0; for (let i = 0; i < 48; i++) sum += freq[i]; target = .35 + sum / (48 * 255) * 1.4; }
  energy += (target - energy) * .12; spin += dt * (.15 + energy * .8);
  const intro = Math.min(1, (now - born) / 900), ease = 1 - Math.pow(1 - intro, 3);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  hudA += ((S.view === 'house' ? .04 : 1) - hudA) * .08; ctx.globalAlpha = hudA;   // the house wants open space
  const cx = W / 2, cy = H * .44, R = Math.min(W * .42, H * .34) * (.85 + .15 * ease);
  ctx.save(); ctx.translate(cx, cy); ctx.globalCompositeOperation = 'lighter';

  // faint range rings + crosshair with gaps
  for (let k = .3; k < 1.25; k += .15) ring(R * k, rgba(A, .045));
  ctx.beginPath();
  for (const [x, y] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { ctx.moveTo(x * R * 1.08, y * R * 1.08); ctx.lineTo(x * R * 1.32, y * R * 1.32); }
  ctx.lineWidth = 1; ctx.strokeStyle = rgba(A, .35); ctx.stroke();

  // outer tick ring + bearing numbers, with a chromatic fringe for that projected-light look
  const rot0 = spin * .05;
  ticks(R + 1.2, 180, rot0, [255, 60, 80], 5, 9, 4, .12 * ease);
  ticks(R - 1.2, 180, rot0, [60, 170, 255], 5, 9, 4, .12 * ease);
  ticks(R, 180, rot0, A, 5, 9, 4, .55 * ease);
  ctx.save(); ctx.rotate(rot0); ctx.font = `400 ${Math.max(8, R * .04)}px "JetBrains Mono"`; ctx.fillStyle = rgba(A, .45 * ease); ctx.textAlign = 'center';
  for (let d = 0; d < 360; d += 30) { ctx.save(); ctx.rotate(d * Math.PI / 180); ctx.fillText(String(d).padStart(3, '0'), 0, -R - 10); ctx.restore(); }
  ctx.restore();

  // segmented arcs (counter-rotating), amber accent arc
  ctx.save(); ctx.rotate(-spin * .32); ctx.shadowBlur = 14; ctx.shadowColor = rgba(A, .8);
  if (ult > .5) { for (let i = 0; i < 3; i++) poly(3, R * (.9 - i * .07), -spin * (i % 2 ? .4 : -.3) + i, A, .75, 2.2); }
  else for (const [s, l] of [[0, 1.3], [1.7, .5], [2.5, 1.6], [4.4, .9], [5.5, .5]]) arc(R * .9, s, s + l * ease, rgba(A, .8), 2.4);
  ctx.shadowBlur = 0; arc(R * .9 + 7, 4.0, 4.0 + .7 * ease, rgba(B, .9), 1.5); ctx.restore();

  // dashed ring
  ctx.save(); ctx.rotate(spin * .12); ctx.setLineDash([1.5, 6]); ring(R * .82, rgba(A, .45)); ctx.setLineDash([]); ctx.restore();

  // text ring; the centre belongs to the 3D figure (hologram.js below)
  const label = (ult > .5 ? 'ULTRON · THERE ARE NO STRINGS ON ME · ' : `${NAMES[S.persona]} · NEURAL CORE · ${S.state.toUpperCase()} · `).repeat(2);
  textRing(label, R * .74, -spin * .08, A, .4 * ease);
  ctx.restore();

  // hand the 3D figure what it needs: colours, Ultron amount, voice level, where the reticle is
  let lv = 0;
  if (analyser && S.speaking) { let s = 0; for (let i = 2; i < 66; i++) s += freq[i]; lv = s / (64 * 255); }
  if (REC.on) lv = S.micLevel || 0;   // the core listens visibly while you talk
  S.level += (lv * 1.6 - S.level) * .3;
  Object.assign(S, { rgbA: A, rgbB: B, ult, energy, R, cy, W, H });

  // corner readouts (real numbers only)
  ctx.globalCompositeOperation = 'source-over'; ctx.font = '400 10px "JetBrains Mono"'; ctx.fillStyle = rgba(A, .6);
  const L = R * 1.34;
  ctx.textAlign = 'right'; ctx.fillText(`CPU ${tele.cpu ?? '--'}%`, cx - L * .7, cy - L * .72); ctx.fillText(`MEM ${tele.ram ?? '--'}%`, cx - L * .7, cy + L * .74);
  ctx.textAlign = 'left'; ctx.fillText(`LAT ${tele.lat ?? '--'}`, cx + L * .7, cy - L * .72); ctx.fillText(`${(tele.model || '').replace('gemini-', '').toUpperCase()}`, cx + L * .7, cy + L * .74);

  // glitch: tear horizontal strips of the frame sideways
  if (now < glitchT && !reduce) {
    for (let i = 0; i < 6; i++) {
      const y = Math.random() * H * DPR, h = (4 + Math.random() * 26) * DPR, dx = (Math.random() - .5) * 40 * DPR;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(cv, 0, y, cv.width, h, dx, y, cv.width, h);
    }
  }
}
const tele = {};
requestAnimationFrame(draw);

/* ================= state & text ================= */
const LABEL = { idle: 'standing by', listening: 'listening', thinking: 'processing', speaking: 'speaking', off: 'asleep' };
function setState(s) {
  S.state = s; const st = $('#status');
  if (!st.classList.contains('eye')) st.lastChild.textContent = LABEL[s];
  st.classList.toggle('busy', s === 'thinking' || s === 'listening');
  $('#mic').setAttribute('aria-pressed', String(s === 'listening'));
}
function setPersona(p) {
  S.persona = p; store.set('persona', p); document.body.dataset.persona = p;
  $$('nav button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === p)));
  if (!S.override) $('#logo-name').textContent = NAMES[p];
}
function setMood(m) {
  S.mood = m;
  if (m === 'ultron') { document.body.dataset.mood = 'ultron'; ultronOverride(true); }
  else { if (S.override) ultronOverride(false); document.body.dataset.mood = 'normal'; }
}
const clockStr = () => new Date().toLocaleTimeString('en-GB', { hour12: false });
function logEntry(who, text) {
  const cls = who === 'you' ? 'you' : who === 'ultron' ? 'ultron' : who === 'sys' ? 'sys' : '';
  const e = document.createElement('div'); e.className = 'entry ' + cls;
  e.innerHTML = '<time></time><div><b></b><p></p></div>';
  e.querySelector('time').textContent = clockStr();
  e.querySelector('b').textContent = who === 'you' ? 'YOU' : who === 'sys' ? 'SYSTEM' : NAMES[who] || who.toUpperCase();
  e.querySelector('p').textContent = text;
  const log = $('#log'); log.append(e); log.scrollTop = log.scrollHeight;
}
function show(segs, cls = '') {
  const main = segs.find(s => s.who !== 'ultron'), u = segs.find(s => s.who === 'ultron');
  const line = $('#line'), ul = $('#uline');
  if (S.mood === 'ultron') { line.className = ''; line.textContent = u?.text || ''; ul.classList.remove('on'); return; }
  line.className = cls + ((main?.text || '').length > 130 ? ' long' : ''); line.textContent = main?.text || '';
  ul.classList.remove('on'); ul.firstChild && (ul.textContent = '');
  if (u) { ul.textContent = u.text; void ul.offsetWidth; ul.classList.add('on'); }
}
function toast(title, body, high) {
  const t = document.createElement('div'); t.className = 'toast' + (high ? ' high' : '');
  t.innerHTML = '<b></b><span></span>'; t.firstChild.textContent = title; t.lastChild.textContent = body;
  $('#toasts').append(t); setTimeout(() => t.remove(), high ? 12000 : 7000);
}
const FRIENDLY = { get_system_stats: 'scanning system', read_latest_emails: 'reading mail', analyze_screen: 'looking at your screen', execute_terminal_command: 'running command',
  read_file_content: 'reading file', list_workspace_files: 'listing files', write_file_content: 'writing file', set_reminder: 'setting reminder', add_task: 'logging task',
  take_note: 'taking note', remember: 'committing to memory', recall: 'searching memory', brief_me: 'compiling briefing', open_application: 'launching app' };
const friendly = n => FRIENDLY[n] || n.replace(/_/g, ' ');

/* ================= server ================= */
async function api(path, body, method) {
  const r = await fetch(path, { method: method || (body ? 'POST' : 'GET'), headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 || r.status === 403) { toast('SESSION', 'Reload the page to reconnect.', true); throw new Error('auth'); }
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.detail || 'request failed'); return j;
}
// "use hermes", "switch to qwen", "switch to gemini 3.5 flash": change the brain without touching a menu.
function switchBrain(text) {
  const m = text.match(/^(?:please\s+)?(?:switch(?:\s+the\s+brain)?\s+to|use)\s+(.+?)(?:\s+(?:model|brain))?[.!]?$/i);
  if (!m) return false;
  const want = m[1].toLowerCase().replace(/\s+/g, ' '), sel = $('#model');
  const opt = [...sel.options].find(o => o.text.toLowerCase().replace(/\s+/g, ' ').includes(want));
  if (!opt) return false;
  sel.value = opt.value; sel.onchange();
  const segs = [{ who: S.persona, text: `Switched to ${opt.text.replace(/\s+·.*|\s+\(.*/, '').trim()}.` }];
  logEntry('you', text); show(segs); logEntry(S.persona, segs[0].text); sayAll(segs);
  return true;
}

async function send(text) {
  text = text.trim(); if (!text || S.busy) return;
  if (switchBrain(text)) return;
  stopSpeaking(); S.busy = true; setMood('normal'); setState('thinking');
  logEntry('you', text); $('#line').className = 'dim'; $('#line').textContent = text; $('#uline').classList.remove('on'); $('#meta').textContent = '';
  try { handle(await api('/api/command', { text, model: $('#model').value || undefined, session_id: SID, persona: S.persona })); }
  catch (e) { show([{ who: S.persona, text: e.message === 'auth' ? 'Session expired. Reload the page.' : 'Link to the core is down. Is the server running?' }], 'bad'); setState('idle'); }
  finally { S.busy = false; $('#activity').textContent = ''; }
}
function handle(r) {
  setMood(r.mood === 'ultron' ? 'ultron' : 'normal');
  const segs = r.segments || [{ who: r.persona, text: r.response }];
  if (r.status === 'needs_confirmation') { show([{ who: r.persona, text: 'Awaiting your authorization.' }], 'dim'); showConfirm(r.confirm); }
  else { hideConfirm(); show(segs, r.status === 'partial' || r.status === 'error' ? 'bad' : ''); }
  segs.forEach(s => logEntry(s.who, s.text));
  tele.lat = (r.ms / 1000).toFixed(1) + 's'; tele.model = r.model;
  $('#v-lat').textContent = tele.lat;
  $('#meta').textContent = `${(r.model || '').replace('ollama/', '').replace('gemini-', '').toUpperCase()} · ${(r.steps || []).length} TOOL${(r.steps || []).length === 1 ? '' : 'S'} · ${tele.lat}`;
  const used = (r.steps || []).map(s => s.tool);
  if (used.includes('enter_standby')) { stopRec(); S.always = false; setSwitch(false); setState('off'); }
  if (S.state !== 'off') { setState('idle'); if (r.status !== 'needs_confirmation') sayAll(segs); else sayAll([{ who: r.persona, text: 'I need your authorization for that.' }]); }
}

/* ================= authorization ================= */
let ttlTimer;
function showConfirm(c) {
  S.confirm = c; $('#c-s').textContent = c.summary; $('#c-w').textContent = c.why ? 'REASON: ' + c.why : '';
  $('#confirm').hidden = false; const t = $('#ttl'); t.style.transition = 'none'; t.style.transform = 'scaleX(1)'; void t.offsetWidth;
  t.style.transition = `transform ${c.ttl}s linear`; t.style.transform = 'scaleX(0)';
  clearTimeout(ttlTimer); ttlTimer = setTimeout(hideConfirm, c.ttl * 1000);   // never autofocus: a stray Enter must not authorize
}
function hideConfirm() { S.confirm = null; $('#confirm').hidden = true; clearTimeout(ttlTimer); }
async function resolveConfirm(ok) {
  const c = S.confirm; if (!c || S.busy) return;
  hideConfirm(); S.busy = true; setState('thinking'); logEntry('sys', ok ? 'Authorized: ' + c.summary : 'Denied: ' + c.summary);
  try { handle(await api('/api/confirm', { session_id: SID, action_id: c.action_id, approve: ok })); } catch { setState('idle'); }
  finally { S.busy = false; }
}
$('#approve').onclick = () => resolveConfirm(true); $('#deny').onclick = () => resolveConfirm(false);

/* ================= listening ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
const WAKE = { friday: /\bfriday\b/i, jarvis: /\bjarvis\b/i, edith: /\b(edith|edit)\b/i };
if (SR) {
  rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true;

base.add(new THREE.LineSegments(segs(Array.from({ length: 72 }, (_, i) => { const a = i / 72 * Math.PI * 2, r0 = i % 6 ? 1.33 : 1.25; return [Math.cos(a) * r0, 0, Math.sin(a) * r0, Math.cos(a) * 1.4, 0, Math.sin(a) * 1.4]; })), lineMat('core', .35)));
const dustN = 380, dust = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++) { const a = Math.random() * 6.28, r = Math.sqrt(Math.random()) * 2.2; dust.set([Math.cos(a) * r, Math.random() * 3.2 - 1.6, Math.sin(a) * r], i * 3); }
const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(dust, 3));
const dustPts = new THREE.Points(dg, add(new THREE.PointsMaterial({ size: .018, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }), 'core', .5, 'A'));
core.add(dustPts);

/* ---------- HOUSE: the mind as a house. Monochrome, one deliberate flaw, and something in the attic. ---------- */
const house = new THREE.Group(); scene.add(house);
const L = [], dashed = [], red = [];
function box(x0, y0, z0, x1, y1, z1, out = L) {
  const P = [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], T = P.map(p => [p[0], y1, p[2]]);
  for (let i = 0; i < 4; i++) out.push([...P[i], ...P[(i + 1) % 4]], [...T[i], ...T[(i + 1) % 4]], [...P[i], ...T[i]]);
}
box(-2, -1, -1.5, 2, 0, 1.5, dashed);                 // engine room, below ground
box(-2, 0, -1.5, 2, 1, 1.5); box(-2, 1, -1.5, 2, 2, 1.5);
L.push([.2, 1, -1.5, .2, 1, 1.5], [.2, 0, -1.5, .2, 1, -1.5], [.2, 0, 1.5, .2, 1, 1.5], [.2, 0, -.25, .2, .78, -.25], [.2, .78, -.25, .2, .78, .3], [.2, .78, .3, .2, 0, .3]);  // study | library wall with a door
L.push([-.5, 1, -1.5, -.5, 2, -1.5], [-.5, 1, 1.5, -.5, 2, 1.5], [-.5, 2, -1.5, -.5, 2, 1.5]);                     // lookout wall
L.push([-1.75, 1.25, 1.5, -.75, 1.25, 1.5], [-.75, 1.25, 1.5, -.75, 1.85, 1.5], [-.75, 1.85, 1.5, -1.75, 1.85, 1.5], [-1.75, 1.85, 1.5, -1.75, 1.25, 1.5], [-1.25, 1.25, 1.5, -1.25, 1.85, 1.5], [-1.75, 1.55, 1.5, -.75, 1.55, 1.5]);  // lookout window
// roof and attic
L.push([-2, 2.9, 0, 2, 2.9, 0]);
for (const x of [-2, -1, 0, 1, 2]) L.push([x, 2, -1.5, x, 2.9, 0], [x, 2.9, 0, x, 2, 1.5]);
// stairs from the library up to the first floor
for (let k = 0; k < 8; k++) {
  const y0 = k / 8, y1 = (k + 1) / 8, z0 = 1.3 - k * .2, z1 = z0 - .2;
  for (const x of [1.25, 1.85]) L.push([x, y0, z0, x, y1, z0], [x, y1, z0, x, y1, z1]);
  L.push([1.25, y1, z0, 1.85, y1, z0]);
}
L.push([1.22, 0, 1.3, 1.22, .48, 1.3], [1.22, 1, -.3, 1.22, 1.42, -.3]);   // newel posts
L.push([1.18, .5, 1.2, 1.18, 1.34, -.12]);                                // the banister: almost right, never quite meets the post
// grid on each floor
for (const y of [0, 1, 2]) { for (let x = -2; x <= 2.01; x += .5) dashed.push([x, y, -1.5, x, y, 1.5]); for (let z = -1.5; z <= 1.51; z += .5) dashed.push([-2, y, z, 2, y, z]); }
// the attic door, on the gable end
red.push([2, 2.04, -.22, 2, 2.56, -.22], [2, 2.56, -.22, 2, 2.56, .22], [2, 2.56, .22, 2, 2.04, .22], [2, 2.04, .22, 2, 2.04, -.22]);
house.add(new THREE.LineSegments(segs(L), lineMat('house', .5, 'H')));
const dl = new THREE.LineSegments(segs(dashed), lineMat('house', .12, 'H')); house.add(dl);
const door = new THREE.LineSegments(segs(red), lineMat('house', .9, 'U')); house.add(door);
const doorGlow = new THREE.Mesh(new THREE.PlaneGeometry(.44, .5), fillMat('house', .1, 'U')); doorGlow.position.set(2.003, 2.3, 0); doorGlow.rotation.y = Math.PI / 2; house.add(doorGlow);
const atticCore = new THREE.Mesh(new THREE.OctahedronGeometry(.16), fillMat('house', .25, 'U')); atticCore.position.set(.9, 2.32, 0); house.add(atticCore);
const ROOMS = { engine: [-2, -1, -1.5, 2, 0, 1.5], study: [-2, 0, -1.5, .2, 1, 1.5], library: [.2, 0, -1.5, 2, 1, 1.5], lookout: [-2, 1, -1.5, -.5, 2, 1.5] };
const fills = {};
for (const [k, [x0, y0, z0, x1, y1, z1]] of Object.entries(ROOMS)) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0 - .04, y1 - y0 - .04, z1 - z0 - .04), fillMat('house', 0, 'A'));
  m.material.side = THREE.BackSide;   // only the inside walls catch the light
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); house.add(m); fills[k] = m;
}
function label(text, x, y, z, tint = 'H') {
  const c = document.createElement('canvas'); c.width = 512; c.height = 64; const g = c.getContext('2d');
  g.font = '500 30px "JetBrains Mono", monospace'; g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(text, 6, 32);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(add(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }), 'house', .85, tint));
  s.scale.set(1.6, .2, 1); s.position.set(x + .8, y, z); s.center.set(0, .5); house.add(s);
}
label('ENGINE ROOM', -1.9, -.85, 1.55); label('STUDY · FRIDAY', -1.9, .14, 1.55); label('LIBRARY · JARVIS', .3, .14, 1.55);
label('LOOKOUT · EDITH', -1.9, 1.14, 1.55); label('ATTIC · LOCKED', -.4, 2.15, 1.0, 'U');
house.scale.setScalar(.52); house.position.y = -.35;

/* ---------- frame loop ---------- */
const cA = new THREE.Color(), cB = new THREE.Color(), cH = new THREE.Color(), cU = new THREE.Color(), white = new THREE.Color(1, 1, 1);
const PROOM = { friday: 'study', jarvis: 'library', edith: 'lookout' };
const look = new THREE.Vector3(), lookT = new THREE.Vector3(), camT = new THREE.Vector3();
let fCore = S.view === 'house' ? 0 : 1, fHouse = 1 - fCore, morph = 0, gAmt = 0, mx = 0, my = 0;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
function fit() {
  const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); composer.setSize(w, h); bloom.resolution.set(w / 2, h / 2);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(fit).observe(canvas); fit();
const toRGB = (c, a) => c.setRGB(a[0] / 255, a[1] / 255, a[2] / 255, THREE.SRGBColorSpace);
camera.position.set(0, .9, 6);

renderer.setAnimationLoop(now => {
  const t = now / 1000, ult = S.ult || 0;
  toRGB(cA, S.rgbA || [103, 232, 249]); toRGB(cB, S.rgbB || [255, 180, 84]); cU.setRGB(1, .12, .2);
  cH.copy(cA).lerp(white, .5 * (1 - ult));                   // the house is near-monochrome until Ultron stirs

  const house3 = S.view === 'house';
  fCore += ((house3 ? 0 : 1) - fCore) * .06; fHouse += ((house3 ? 1 : 0) - fHouse) * .06;
  core.visible = fCore > .01; house.visible = fHouse > .01;
  morph += (Math.min(1, Math.max(0, (ult - .3) / .5)) - morph) * .05;

  // size the core to sit inside the 2D reticle
  const dist = camera.position.distanceTo(look), unit = 2 * dist * Math.tan(THREE.MathUtils.degToRad(19)) / (S.H || canvas.clientHeight || 1);
  const R = S.R || 200; core.scale.setScalar(R * .82 * unit / 1.72);
  core.position.y = ((S.H || 0) * .5 - (S.cy || 0)) * unit;
  core.rotation.y += .003 + (S.energy || .2) * .006 + morph * .02;
  orbits.forEach((o, i) => { o.rotation.y += (i % 2 ? -1 : 1) * (.004 + i * .002 + morph * .03); });
  const sy = Math.sin(t * .7) * .9; scan.position.y = sy; scan.scale.setScalar(Math.sqrt(Math.max(0, 1 - sy * sy)));
  const dp = dg.attributes.position; for (let i = 0; i < dustN; i++) { let y = dp.getY(i) + .002; if (y > 1.6) y = -1.6; dp.setY(i, y); } dp.needsUpdate = true;
  pu.uTime.value = t; pu.uLevel.value = S.level || (S.state === 'listening' ? .25 + .15 * Math.sin(t * 5) : 0);
  pu.uMorph.value = morph; pu.uSize.value = 3.2 * renderer.getPixelRatio(); pu.uColor.value.copy(cA); pu.uFade.value = fCore;

  // house: camera orbits slowly; Ultron leans on the attic door
  for (const [k, m] of Object.entries(fills)) {
    S.pulse[k] = (S.pulse[k] || 0) * .975;
    m.material.userData.base = .006 + (PROOM[S.persona] === k ? .018 : 0) + S.pulse[k] * .1;   // a lit room, not a lit box
  }
  doorGlow.material.userData.base = .08 + ult * .7 + (Math.random() < .03 ? .1 : 0);
  atticCore.material.userData.base = .25 + ult * .75; atticCore.rotation.y += .01 + ult * .08; atticCore.rotation.x += .004;
  door.position.x = ult > .3 ? (Math.random() - .5) * .03 * ult : 0;

  for (const [group, f] of [['core', fCore], ['house', fHouse]]) for (const m of fade[group]) {
    const { base, tint } = m.userData;
    m.opacity = (tint === 'U' && group === 'core' ? base + morph * .9 : base) * f * (tint === 'A' && group === 'core' ? 1 - morph * .7 : 1);
    m.color.copy(tint === 'B' ? cB : tint === 'U' ? cU : tint === 'H' ? cH : cA);
  }
  shell.material.opacity = .2 * fCore * (1 - morph);

  if (house3) { const a = t * .05 + mx * .8; camT.set(Math.sin(a) * 6.4, 2.6 - my * 1.5, Math.cos(a) * 6.4); lookT.set(0, .15, 0); }
  else { camT.set(mx * .6, .9 - my * .4, 6); lookT.set(0, 0, 0); }
  camera.position.lerp(camT, .04); look.lerp(lookT, .06); camera.lookAt(look);

  // glitch: on demand (view switch, Ultron cutting in) plus small tears while he has the floor
  gAmt = Math.max(gAmt * .9, now < S.glitchUntil ? 1 : 0, ult > .5 && Math.random() < .05 ? .55 : 0);
  glitch.uniforms.uAmt.value = gAmt; glitch.uniforms.uTime.value = t;
  bloom.strength = .85 + (S.energy || .2) * .35 + ult * .4;
  composer.render();
});
